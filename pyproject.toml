[project]
name = "bookdistill-contracts"
version = "0.1.0"
description = "Versioned data contracts for the BookDistill document-processing pipeline."
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.16,<2",
    "celery[redis]>=5.5,<6",
    "fastapi>=0.116,<1",
    "pydantic>=2.12,<3",
    "pymupdf>=1.26,<2",
    "pypdf>=6,<7",
    "python-multipart>=0.0.20,<1",
    "redis>=6,<7",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
qdrant = ["qdrant-client>=1.15,<2"]
models = ["fastembed>=0.8,<1"]
local-llm = [
    "accelerate>=1.10,<2",
    "peft>=0.17,<1",
    "torch>=2.5,<3",
    "transformers>=4.57,<5",
]
test = ["httpx>=0.28,<1"]

[project.scripts]
bookdistill-api = "bookdistill.api:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
