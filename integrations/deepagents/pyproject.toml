[project]
name = "bookdistill-deepagents"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["deepagents==0.7.23", "httpx>=0.28,<1", "langchain-openai==1.6.6"]

[project.optional-dependencies]
test = ["pytest>=9,<10"]

[project.scripts]
bookdistill-agent = "bookdistill_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
