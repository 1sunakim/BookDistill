[project]
name = "bookdistill-deepagents"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = ["deepagents==0.7.23", "fastapi>=0.116,<1", "httpx>=0.28,<1", "langchain-openai==1.6.6", "uvicorn>=0.35,<1"]

[project.optional-dependencies]
test = ["pytest>=9,<10"]

[project.scripts]
bookdistill-agent = "bookdistill_agent.cli:main"
bookdistill-agent-api = "bookdistill_agent.service:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
