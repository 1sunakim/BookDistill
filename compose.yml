services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bookdistill
      POSTGRES_USER: bookdistill
      POSTGRES_PASSWORD: bookdistill
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookdistill"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.15.4
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    command: alembic upgrade head
    environment: &app-env
      BOOKDISTILL_DATABASE_URL: postgresql+psycopg://bookdistill:bookdistill@postgres:5432/bookdistill
      BOOKDISTILL_REDIS_URL: redis://redis:6379/0
      BOOKDISTILL_STORAGE_ROOT: /app/data
      BOOKDISTILL_QUEUE_MODE: celery
      BOOKDISTILL_DENSE_BACKEND: qdrant
      BOOKDISTILL_QDRANT_URL: http://qdrant:6333
      BOOKDISTILL_QDRANT_COLLECTION: bookdistill_chunks
      BOOKDISTILL_EMBEDDING_DIMENSION: 512
      BOOKDISTILL_EMBEDDING_PROVIDER: fastembed
      BOOKDISTILL_EMBEDDING_MODEL: BAAI/bge-small-zh-v1.5
      BOOKDISTILL_RERANKER_PROVIDER: fastembed
      BOOKDISTILL_RERANKER_MODEL: BAAI/bge-reranker-base
      BOOKDISTILL_MODEL_CACHE_DIR: /app/model-cache
      BOOKDISTILL_LLM_PROVIDER: ${BOOKDISTILL_LLM_PROVIDER:-disabled}
      BOOKDISTILL_LLM_MODEL: ${BOOKDISTILL_LLM_MODEL:-}
      BOOKDISTILL_LLM_BASE_URL: ${BOOKDISTILL_LLM_BASE_URL:-https://api.openai.com/v1}
      BOOKDISTILL_LLM_API_KEY: ${BOOKDISTILL_LLM_API_KEY:-}
      BOOKDISTILL_LLM_TIMEOUT_SECONDS: ${BOOKDISTILL_LLM_TIMEOUT_SECONDS:-60}
      BOOKDISTILL_LLM_RESPONSE_FORMAT: ${BOOKDISTILL_LLM_RESPONSE_FORMAT:-json_schema}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    environment: *app-env
    ports:
      - "8000:8000"
    volumes:
      - app_data:/app/data
      - model_cache:/app/model-cache
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    build: .
    command: celery -A bookdistill.worker:celery_app worker --loglevel=INFO
    environment: *app-env
    volumes:
      - app_data:/app/data
      - model_cache:/app/model-cache
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  beat:
    build: .
    command: celery -A bookdistill.worker:celery_app beat --loglevel=INFO
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  app_data:
  model_cache:
