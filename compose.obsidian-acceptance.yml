# Use only with -p bookdistill-obsidian-acceptance and --env-file .env.example.
# This local-only test key is intentionally unrelated to any existing installation.
services:
  api:
    ports: !override
      - "127.0.0.1:18016:8000"
    environment:
      BOOKDISTILL_API_KEY: isolated-acceptance-key
      BOOKDISTILL_LLM_PROVIDER: demo
      BOOKDISTILL_LLM_API_KEY: ""
      BOOKDISTILL_CORS_ORIGINS: http://127.0.0.1:13016,http://localhost:13016
  worker:
    environment:
      BOOKDISTILL_API_KEY: isolated-acceptance-key
      BOOKDISTILL_LLM_PROVIDER: demo
      BOOKDISTILL_LLM_API_KEY: ""
  frontend:
    ports: !override
      - "127.0.0.1:13016:3000"
    build:
      args:
        NEXT_PUBLIC_BOOKDISTILL_API_URL: http://127.0.0.1:18016
